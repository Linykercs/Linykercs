name: Update profile card

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render card
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/generate.ps1

      - name: Commit changes
        run: |
          git config user.name "Linykercs"
          git config user.email "204272230+Linykercs@users.noreply.github.com"
          git add dark.svg light.svg
          git diff --cached --quiet || git commit -m "Update profile card"
          git push
